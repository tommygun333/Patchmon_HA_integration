# Home Assistant automations.yaml: choose PatchMon hosts via
# Settings -> Devices & services -> PatchMon -> Configure -> Automatic security updates.
# Start disabled. Verify backup sensors and configure the host list first.
- id: patchmon_weekly_security_maintenance
  alias: PatchMon weekly security maintenance
  description: Validate, install and verify the explicitly opted-in hosts in order.
  enabled: false
  triggers:
    - trigger: time
      at: "03:50:00"
  conditions:
    - condition: time
      weekday:
        - sun
  actions:
    # Wait for the nightly VZDump and PBS verification to finish.
    # If timed out, PatchMon still runs preflight so a blocked cycle is reported.
    - wait_template: >-
        {{ is_state('binary_sensor.patchmon_pbs_ready', 'on')
           and is_state('binary_sensor.patchmon_vzdump_ready', 'on')
           and is_state('binary_sensor.patchmon_vzdump_idle', 'on') }}
      timeout: "00:20:00"
      continue_on_timeout: true
    - action: patchmon.security_maintenance
      data:
        # host_ids intentionally omitted: uses the selected hosts from
        # the integration's Automatic security updates options screen.
        # Set config_entry_id here only if multiple PatchMon servers configured.
        mode: install
        stop_on_failure: true
        max_report_age_minutes: 120
        notify: true
        require_backup_checks: true
        backup_checks:
          - entity_id: binary_sensor.patchmon_pbs_ready
            expected_state: "on"
            timestamp_attribute: last_success
            max_age_hours: 6
          - entity_id: binary_sensor.patchmon_vzdump_ready
            expected_state: "on"
            timestamp_attribute: last_success
            max_age_hours: 6
        backup_idle_checks:
          - entity_id: binary_sensor.patchmon_vzdump_idle
            expected_state: "on"
        # Optional: per-host health checks still use PatchMon host UUID keys.
        # health_checks: {}
      response_variable: patchmon_cycle
  mode: single
  max_exceeded: warning
